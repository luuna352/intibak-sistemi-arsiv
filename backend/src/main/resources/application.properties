spring.application.name=intibak-sistemi

# Kök klasördeki .env dosyasını okur (POSTGRES_PASSWORD orada). Uygulama backend/ veya kök klasörden
# başlatılabildiği için iki konum da denenir; dosya yoksa hata vermez.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Veritabanı (compose.yaml'daki PostgreSQL, 5433 portu)
spring.datasource.url=jdbc:postgresql://localhost:5433/intibak_sistemi
spring.datasource.username=intibak_sistemi
spring.datasource.password=${POSTGRES_PASSWORD:}

# Tabloları Flyway kurar (src/main/resources/db/migration). Hibernate tablo oluşturmaz,
# sadece entity'lerin tablolarla uyumlu olduğunu kontrol eder.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Veritabanı bağlantısı sadece Service katmanındaki işlem süresince açık kalır.
spring.jpa.open-in-view=false

# Session cookie'si (JSESSIONID) JavaScript'ten okunamaz (HttpOnly, varsayılan) ve başka sitelerden gelen
# POST isteklerine eklenmez (Lax).
server.servlet.session.cookie.same-site=lax

# Ders planı Excel yükleme: bir plan dosyası birkaç yüz KB olur; 5 MB üstü reddedilir (ApiExceptionHandler).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
